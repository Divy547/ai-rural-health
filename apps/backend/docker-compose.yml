services:

  postgres:

    image: postgres:17

    container_name: ai-rural-health-db

    restart: always

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_rural_health

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: